<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04070e}p{margin:0}a{color:#c9b48b}a:hover{color:#dccaa3}</style>
</helmet>
<div style="font-family:'Albert Sans',system-ui,sans-serif;color:#ebe9e4;display:flex;flex-direction:column;gap:{{ gap }};width:100%;position:relative">
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;border:1px dashed rgba(235,233,228,0.22)">
      <span style="width:12px;height:12px;flex:none;margin-top:4px;box-sizing:border-box;border-radius:50%;border:1.5px dashed #a9a69e"></span>
      <div style="display:flex;flex-direction:column;gap:2px"><p style="font-size:14px;font-weight:500">No comparison published</p><p style="font-size:12.5px;color:#a9a69e;text-wrap:pretty">{{ emptyWhy }}</p></div>
    </div>
  </sc-if>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><p style="font-size:{{ titleSize }};font-weight:500">{{ g.title }}</p><p style="font-size:12px;color:#8d8a83">{{ g.sub }}</p></div>
      </sc-if>
      <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
        <div onMouseEnter="{{ r.enter }}" onMouseLeave="{{ r.leave }}" style="display:grid;grid-template-columns:{{ cols }};align-items:center;gap:10px;font-size:13px;padding:2px 0;border-radius:6px;background:{{ r.hl }}">
          <span style="display:flex;align-items:center;gap:8px;color:#d4d2cc;line-height:1.2;min-width:0"><span style="width:10px;height:10px;flex:none;border-radius:2px;background:{{ r.color }};border:{{ r.swBd }};box-sizing:border-box"></span>{{ r.label }}</span>
          <span style="position:relative;height:{{ barH }};border-radius:3px;background:rgba(235,233,228,0.06)">
            <span style="position:absolute;left:0;top:0;bottom:0;width:{{ r.w }};border-radius:3px;background:{{ r.color }};background-image:{{ r.pattern }}"></span>
            <sc-if value="{{ r.hasCi }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;left:{{ r.ciL }};width:{{ r.ciW }};top:50%;height:10px;margin-top:-5px;border-left:1.5px solid #ebe9e4;border-right:1.5px solid #ebe9e4;box-sizing:border-box"><span style="position:absolute;left:0;right:0;top:4px;height:1.5px;background:#ebe9e4"></span></span></sc-if>
          </span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:{{ numSize }};text-align:right">{{ r.pct }}</span>
          <sc-if value="{{ showN }}" hint-placeholder-val="{{ true }}"><span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8d8a83;white-space:nowrap">{{ r.nText }}</span></sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
  <sc-if value="{{ hasAxis }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:{{ cols }};gap:10px"><span></span><span style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:#6f6c66"><span>0%</span><span>{{ axisMax }}</span></span></div>
  </sc-if>
  <sc-if value="{{ tipOn }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;right:0;top:{{ tip.top }};width:220px;box-sizing:border-box;padding:10px 12px;border-radius:14px;background:rgba(8,16,31,0.95);border:1px solid rgba(235,233,228,0.14);backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,0.45);display:flex;flex-direction:column;gap:4px;pointer-events:none;z-index:3">
      <p style="font-size:12.5px;font-weight:500">{{ tip.label }}</p>
      <p style="font-family:'JetBrains Mono',monospace;font-size:12px">{{ tip.main }}</p>
      <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#a9a69e">{{ tip.sub }}</p>
    </div>
  </sc-if>
  <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}"><p style="font-size:12.5px;color:#a9a69e;text-wrap:pretty">{{ note }}</p></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:260},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,sub?:string,rows:{label:string,k:number,n:number,color:string,ci?:[number,number],hatch?:boolean}[]}[]&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;technical&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;\&quot;plain\&quot; | \&quot;technical\&quot;&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;empty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const MATAM = [
  { title: "Qadirabad · flagged by the radar rule", sub: "first assessment minus the baseline median", rows: [
    { label: "New water (optical)", k: 332, n: 516, color: "#0072b2" },
    { label: "Already water (optical)", k: 748, n: 4393, color: "#56b4e9" },
    { label: "Stayed dry (optical)", k: 38, n: 3866, color: "#a8997a" } ] },
];
const fmt = (n) => n.toLocaleString("en-US");
class Component extends DCLogic {
  state = { hi: null };
  renderVals() {
    const p = this.props, compact = !!p.compact, tech = (p.mode ?? "plain") === "technical";
    const G = p.groups || MATAM, empty = !!p.empty || !G.length;
    const allPct = G.flatMap((g) => g.rows.map((r) => (r.k / r.n) * 100)), max = p.max ?? 100;
    const showGroups = compact ? G.slice(0, 1) : G;
    let idx = 0, tipRow = null;
    const groups = showGroups.map((g, gi) => ({ title: g.title, sub: g.sub, hasTitle: !compact || !!p.compactTitle, rows: g.rows.map((r) => {
      const my = idx++, pc = (r.k / r.n) * 100, hl = this.state.hi === my;
      if (hl) tipRow = { r, pc, my };
      const ci = r.ci && tech;
      return { label: r.label, color: r.color, swBd: r.outline ? "1px solid #ebe9e4" : "0", pattern: r.hatch ? "repeating-linear-gradient(135deg,rgba(4,7,14,0.5) 0 2px,transparent 2px 5px)" : "none",
        w: `${Math.max(0.6, (pc / max) * 100).toFixed(2)}%`, pct: `${pc.toFixed(1)}%`, nText: `${fmt(r.k)} / ${fmt(r.n)}`,
        hasCi: !!ci, ciL: ci ? `${((r.ci[0] / max) * 100).toFixed(2)}%` : "0", ciW: ci ? `${(((r.ci[1] - r.ci[0]) / max) * 100).toFixed(2)}%` : "0",
        hl: hl ? "rgba(235,233,228,0.05)" : "transparent", enter: () => this.setState({ hi: my }), leave: () => this.setState({ hi: null }) };
    }) }));
    const tipOn = !!tipRow && p.tooltip !== false;
    return {
      empty, emptyWhy: p.emptyWhy || "Fewer than 25% of radar cells had clear optical views on both dates, so we withheld the comparison.",
      groups: empty ? [] : groups, compact, gap: compact ? "6px" : "16px", titleSize: compact ? "12.5px" : "14px", barH: compact ? "10px" : "14px", numSize: compact ? "12px" : "13px",
      showN: !compact || tech, cols: compact ? (tech ? "104px minmax(0,1fr) 44px 86px" : "112px minmax(0,1fr) 44px") : "160px minmax(0,1fr) 56px 110px",
      hasAxis: tech && !empty && !compact, axisMax: `${max}%`,
      tipOn, tip: tipRow ? { top: `${Math.min(70, 10 + tipRow.my * 14)}%`, label: tipRow.r.label, main: `${tipRow.pc.toFixed(1)}% · ${fmt(tipRow.r.k)} of ${fmt(tipRow.r.n)} cells`, sub: tipRow.r.ci ? `interval ${tipRow.r.ci[0]}–${tipRow.r.ci[1]}%` : "spatially dependent cells; no interval published" } : { top: "0", label: "", main: "", sub: "" },
      showNote: !!p.note || (!compact && !empty && !p.groups), note: p.note || "Percentages are shares of cells in each optical group. Cells next to each other are not independent, so these are descriptions, not accuracy scores.",
    };
  }
}
</script>
</body>
</html>
