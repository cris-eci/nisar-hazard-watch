<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#04070e}p{margin:0}a{color:#c9b48b}a:hover{color:#dccaa3}</style>
</helmet>
<div style="font-family:'Albert Sans',system-ui,sans-serif;color:#ebe9e4;display:flex;flex-direction:column;gap:8px;width:100%">
  <div style="position:relative">
    <svg viewBox="{{ vb }}" width="100%" style="display:block;overflow:visible" role="img" aria-label="{{ aria }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}">
      <rect x="{{ refArea.x }}" y="{{ refArea.y }}" width="{{ refArea.w }}" height="{{ refArea.h }}" fill="rgba(235,233,228,0.035)"></rect>
      <text x="{{ refArea.lx }}" y="{{ refArea.ly }}" fill="#8d8a83" font-family="JetBrains Mono" font-size="9.5" letter-spacing="0.06em">{{ refArea.label }}</text>
      <sc-for list="{{ grid }}" as="g" hint-placeholder-count="0">
        <line x1="{{ g.x1 }}" x2="{{ g.x2 }}" y1="{{ g.y }}" y2="{{ g.y }}" stroke="rgba(235,233,228,0.07)"></line>
        <text x="{{ g.tx }}" y="{{ g.ty }}" fill="#8d8a83" font-family="JetBrains Mono" font-size="10" text-anchor="end">{{ g.label }}</text>
      </sc-for>
      <sc-for list="{{ bands }}" as="b" hint-placeholder-count="2">
        <path d="{{ b.area }}" fill="{{ b.fill }}"></path>
        <path d="{{ b.edges }}" fill="none" stroke="{{ b.edge }}" stroke-opacity="0.55" stroke-dasharray="2 3"></path>
      </sc-for>
      <sc-if value="{{ hasTarget }}" hint-placeholder-val="{{ true }}">
        <line x1="{{ tgt.x }}" x2="{{ tgt.x }}" y1="{{ tgt.y1 }}" y2="{{ tgt.y2 }}" stroke="#c9b48b" stroke-width="1.25"></line>
        <text x="{{ tgt.x }}" y="{{ tgt.ly }}" fill="#c9b48b" font-family="JetBrains Mono" font-size="9.5" letter-spacing="0.06em" text-anchor="middle">{{ tgt.label }}</text>
      </sc-if>
      <sc-for list="{{ series }}" as="s" hint-placeholder-count="2">
        <path d="{{ s.path }}" fill="none" stroke="{{ s.color }}" stroke-width="2" stroke-dasharray="{{ s.dash }}" stroke-linejoin="round" stroke-linecap="round"></path>
        <sc-for list="{{ s.pts }}" as="p" hint-placeholder-count="5">
          <circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.halo }}" fill="none" stroke="#ebe9e4" stroke-width="1.5" opacity="{{ p.haloOp }}"></circle>
          <circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.r }}" fill="{{ p.fill }}" stroke="{{ s.color }}" stroke-width="1.75" opacity="{{ p.cOp }}"></circle>
          <rect x="{{ p.sx }}" y="{{ p.sy }}" width="{{ p.ss }}" height="{{ p.ss }}" fill="{{ p.fill }}" stroke="{{ s.color }}" stroke-width="1.75" opacity="{{ p.sOp }}"></rect>
        </sc-for>
        <text x="{{ s.lx }}" y="{{ s.ly }}" fill="{{ s.color }}" font-family="JetBrains Mono" font-size="11" font-weight="500" opacity="{{ s.labelOp }}">{{ s.id }}</text>
      </sc-for>
      <sc-for list="{{ xl }}" as="t" hint-placeholder-count="3">
        <text x="{{ t.x }}" y="{{ t.y }}" fill="{{ t.ink }}" font-family="JetBrains Mono" font-size="10" text-anchor="middle">{{ t.label }}</text>
      </sc-for>
      <sc-if value="{{ hoverOn }}" hint-placeholder-val="{{ false }}"><line x1="{{ hover.x }}" x2="{{ hover.x }}" y1="{{ tgt.y1 }}" y2="{{ tgt.y2 }}" stroke="rgba(235,233,228,0.35)"></line></sc-if>
    </svg>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:18%;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;pointer-events:none;padding:0 12px">
        <span style="width:12px;height:12px;box-sizing:border-box;border-radius:50%;border:1.5px dashed #a9a69e"></span>
        <p style="font-size:{{ emptySize }};font-weight:500">Not enough radar yet</p>
        <p style="font-size:12px;color:#a9a69e;max-width:36ch;text-wrap:pretty">{{ emptyWhy }}</p>
      </div>
    </sc-if>
    <sc-if value="{{ hoverOn }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:{{ tip.l }};top:4px;transform:{{ tip.tf }};min-width:172px;box-sizing:border-box;padding:10px 12px;border-radius:14px;background:rgba(8,16,31,0.94);border:1px solid rgba(235,233,228,0.14);backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,0.45);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2">
        <p style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.04em;color:#ebe9e4">{{ tip.date }}</p>
        <p style="font-size:11.5px;color:#a9a69e">{{ tip.phase }}</p>
        <sc-for list="{{ tip.rows }}" as="r" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
            <svg width="16" height="8" viewBox="0 0 16 8"><line x1="0" x2="16" y1="4" y2="4" stroke="{{ r.color }}" stroke-width="2" stroke-dasharray="{{ r.dash }}"></line></svg>
            <span style="color:#d4d2cc">{{ r.id }}</span>
            <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;color:{{ r.ink }}">{{ r.v }}</span>
          </div>
          <sc-if value="{{ r.hasSub }}" hint-placeholder-val="{{ false }}"><p style="margin-top:-4px;padding-left:24px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#8d8a83">{{ r.sub }}</p></sc-if>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:#a9a69e">
    <sc-for list="{{ legend }}" as="l" hint-placeholder-count="3">
      <span style="display:flex;align-items:center;gap:6px;white-space:nowrap"><svg width="22" height="10" viewBox="0 0 22 10" style="overflow:visible"><rect x="0" y="0" width="22" height="10" rx="2" fill="{{ l.fill }}" stroke="{{ l.box }}" stroke-dasharray="2 2"></rect><line x1="0" x2="22" y1="5" y2="5" stroke="{{ l.line }}" stroke-width="2" stroke-dasharray="{{ l.dash }}"></line><circle cx="11" cy="5" r="{{ l.dot }}" fill="#08101f" stroke="{{ l.line }}" stroke-width="1.5"></circle><rect x="8" y="2" width="{{ l.sq }}" height="{{ l.sq }}" fill="#08101f" stroke="{{ l.line }}" stroke-width="1.5"></rect></svg>{{ l.label }}</span>
    </sc-for>
    <sc-if value="{{ demo }}" hint-placeholder-val="{{ true }}"><span style="margin-left:auto;padding:2px 7px;border-radius:999px;background:rgba(245,158,11,0.18);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.05em;color:#fcd34d">DEMO DATA</span></sc-if>
  </div>
  <sc-if value="{{ showSentence }}" hint-placeholder-val="{{ true }}"><p style="font-size:{{ sentSize }};color:#d4d2cc;text-wrap:pretty;line-height:1.45">{{ sentence }}</p></sc-if>
  <sc-if value="{{ tech }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding-top:8px;border-top:1px solid rgba(235,233,228,0.08)">
      <sc-for list="{{ techRows }}" as="r" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.05em;color:#8d8a83">{{ r.k }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#d4d2cc">{{ r.v }}</span></div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:360},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:520,&quot;tsType&quot;:&quot;number&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:220,&quot;tsType&quot;:&quot;number&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plain&quot;,&quot;technical&quot;],&quot;default&quot;:&quot;plain&quot;,&quot;tsType&quot;:&quot;\&quot;plain\&quot; | \&quot;technical\&quot;&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;departure&quot;,&quot;within&quot;,&quot;insufficient&quot;],&quot;default&quot;:&quot;departure&quot;,&quot;tsType&quot;:&quot;\&quot;departure\&quot; | \&quot;within\&quot; | \&quot;insufficient\&quot;&quot;},&quot;tipIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number | null&quot;},&quot;demo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showSentence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;sentence&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;series&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{dates:string[],phase:string[],HH:number[],HV:number[],median?:object,cell?:string,insufficient?:boolean}&quot;},&quot;emptyWhy&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const DATES = ["2026-08-03", "2026-08-15", "2026-08-27", "2026-09-08", "2026-09-20", "2026-10-02", "2026-10-14"];
const PHASE = ["base", "base", "base", "base", "base", "gap", "target"];
const VAR = {
  departure: { HH: [-9.8, -10.4, -9.6, -10.9, -10.1, null, -16.2], HV: [-17.1, -17.6, -16.8, -17.9, -17.3, null, -21.0] },
  within: { HH: [-9.8, -10.4, -9.6, -10.9, -10.1, null, -11.2], HV: [-17.1, -17.6, -16.8, -17.9, -17.3, null, -17.0] },
  insufficient: { HH: [null, -10.4, null, -10.9, null, null, null], HV: [null, -17.6, null, -17.9, null, null, null] },
};
const SER = { HH: { color: "#e8894a", dash: "", fill: "rgba(232,137,74,0.13)", sq: false }, HV: { color: "#6fb3e8", dash: "6 4", fill: "rgba(111,179,232,0.13)", sq: true } };
const HALF = 3;
const day = (s) => Date.parse(s) / 86400000;
const fd = (d) => new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
class Component extends DCLogic {
  state = { hi: null };
  renderVals() {
    const p = this.props, W = p.width ?? 520, H = p.height ?? 220, tech = (p.mode ?? "plain") === "technical", small = W < 380;
    const S0 = p.series || null, DT = S0?.dates || DATES, PH = S0?.phase || PHASE, variant = p.variant ?? "departure";
    const V = S0 ? { HH: S0.HH, HV: S0.HV } : VAR[variant] || VAR.departure, empty = S0 ? !!S0.insufficient : variant === "insufficient";
    const TI = PH.indexOf("target"), BI = PH.map((x, i) => (x === "base" ? i : -1)).filter((i) => i >= 0), LB = BI[BI.length - 1];
    const L = tech ? 46 : 8, R = 30, T = 20, B = 22, x0 = S0 ? day(DT[0]) - 8 : day("2026-07-28"), x1 = S0 ? day(DT[DT.length - 1]) + 10 : day("2026-10-20"), y0 = -29, y1 = -4;
    const X = (d) => L + ((day(d) - x0) / (x1 - x0)) * (W - L - R), Y = (v) => T + ((y1 - v) / (y1 - y0)) * (H - T - B);
    const f = (n) => n.toFixed(1);
    const med = (a) => { const b = a.filter((v) => v != null).sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };
    const series = ["HH", "HV"].map((id) => {
      const vals = V[id], S = SER[id], m = S0?.median?.[id] ?? med(BI.map((i) => vals[i]));
      let path = "", pen = false;
      vals.forEach((v, i) => { if (v == null || PH[i] === "target") { pen = false; return; } path += `${pen ? "L" : "M"}${f(X(DT[i]))} ${f(Y(v))} `; pen = true; });
      const pts = vals.map((v, i) => {
        if (v == null) return null;
        const isT = PH[i] === "target", out = m != null && Math.abs(v - m) > HALF, r = isT ? (small ? 4.5 : 5.5) : small ? 2.75 : 3.25, x = X(DT[i]), y = Y(v);
        return { x: f(x), y: f(y), r, halo: r + 3.5, haloOp: out ? 1 : 0, fill: isT ? S.color : "#08101f", cOp: S.sq ? 0 : 1, sOp: S.sq ? 1 : 0, sx: f(x - r), sy: f(y - r), ss: f(r * 2) };
      }).filter(Boolean);
      const tv = vals[TI];
      return { id, ...S, med: m, tv, out: tv != null && m != null && Math.abs(tv - m) > HALF, path, pts, lx: f(X(DT[TI]) + 10), ly: f(Y(tv ?? m ?? -10) + 4), labelOp: tv != null ? 1 : 0 };
    });
    const bx = X(DT[0]) - 6, bx2 = X(DT[TI]) + 12;
    const bands = empty ? [] : series.map((s) => { const hi = Y(s.med + HALF), lo = Y(s.med - HALF); return { area: `M${f(bx)} ${f(hi)} H${f(bx2)} V${f(lo)} H${f(bx)} Z`, edges: `M${f(bx)} ${f(hi)} H${f(bx2)} M${f(bx)} ${f(lo)} H${f(bx2)}`, fill: s.fill, edge: s.color }; });
    const grid = tech ? [-25, -20, -15, -10, -5].map((v) => ({ x1: L, x2: W - R, y: f(Y(v)), tx: L - 6, ty: f(Y(v) + 3.5), label: `${v} dB` })) : [];
    const xl = tech && !small ? DT.map((d, i) => ({ x: f(X(d)), y: H - 4, ink: PH[i] === "target" ? "#c9b48b" : "#8d8a83", label: new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) }))
      : [[DT[BI[Math.floor(BI.length / 2)]] || DT[0], "EARLIER PASSES"]].map(([d, l]) => ({ x: f(X(d)), y: H - 4, label: l, ink: "#8d8a83" }));
    const hiI = p.tipIndex ?? this.state.hi, hoverOn = hiI != null && !empty;
    const both = series.every((s) => s.out), any = series.some((s) => s.out);
    const sentence = p.sentence || (empty ? "Only two usable passes in this window. The band needs at least three earlier passes, so there is no verdict." : both ? "On the target pass both radar channels came back darker than in any earlier pass, outside this spot's normal range. Calm open water often does that." : any ? "One channel left its normal range on the target pass; the other stayed inside." : "On the target pass both channels stayed inside this spot's normal range.");
    let tip = { l: "0px", tf: "none", date: "", phase: "", rows: [] };
    if (hoverOn) {
      const i = hiI, x = X(DT[i]);
      tip = { l: `${((x / W) * 100).toFixed(1)}%`, tf: x / W > 0.6 ? "translateX(calc(-100% - 12px))" : "translateX(12px)", date: fd(DT[i]).toUpperCase(),
        phase: PH[i] === "target" ? "Target pass · compared" : PH[i] === "gap" ? "Onset day · not used, the line breaks" : "Baseline pass · defines the range",
        rows: series.map((s) => { const v = V[s.id][i], d = v != null && s.med != null ? v - s.med : null; return { id: s.id, color: s.color, dash: s.dash || "0", v: v == null ? "no data" : `${f(v)} dB`, ink: v == null ? "#8d8a83" : "#ebe9e4", hasSub: tech && d != null, sub: d != null ? `${d > 0 ? "+" : ""}${f(d)} dB vs median · band ±${HALF}` : "" }; }) };
    }
    return {
      vb: `0 0 ${W} ${H}`, tech, series, bands, grid, xl, demo: p.demo !== false, empty, emptySize: small ? "14px" : "16px",
      emptyWhy: p.emptyWhy || "No usable pixels on 3 of 5 dates. We tried one alternative series; it had the same gap.",
      hasTarget: !empty, tgt: { x: f(X(DT[TI])), y1: T - 4, y2: H - B, ly: T - 9, label: "TARGET" },
      refArea: { x: f(bx), y: T - 4, w: f(X(DT[LB]) + 6 - bx), h: H - B - T + 4, lx: f(bx + 4), ly: T + 7, label: tech && !small ? `BASELINE · ${BI.length} PASSES` : "" },
      hoverOn, hover: { x: hoverOn ? f(X(DT[hiI])) : 0 }, tip,
      onMove: (e) => { if (p.tipIndex != null || empty) return; const r = e.currentTarget.getBoundingClientRect(), xx = ((e.clientX - r.left) / r.width) * W; let b = 0, bd = 1e9; DT.forEach((d, i) => { const dd = Math.abs(X(d) - xx); if (dd < bd) { bd = dd; b = i; } }); if (b !== this.state.hi) this.setState({ hi: b }); },
      onLeave: () => this.setState({ hi: null }),
      aria: `HH and HV backscatter at the point: baseline passes and the target pass, each channel's normal range shaded.`,
      legend: [
        { label: "HH", line: "#e8894a", dash: "0", fill: "none", box: "none", dot: 3, sq: 0 },
        { label: "HV", line: "#6fb3e8", dash: "4 3", fill: "none", box: "none", dot: 0, sq: 6 },
        ...(empty ? [] : [{ label: "Normal range", line: "none", dash: "0", fill: "rgba(235,233,228,0.12)", box: "rgba(235,233,228,0.45)", dot: 0, sq: 0 }]),
        ...(tech && !empty ? [{ label: "Outside range", line: "#ebe9e4", dash: "0", fill: "none", box: "none", dot: 3.5, sq: 0 }] : []),
      ],
      showSentence: p.showSentence !== false, sentence, sentSize: small ? "13px" : "14.5px",
      techRows: empty ? [{ k: "BASELINE", v: "2 of ≥3 passes needed" }, { k: "SERIES TRIED", v: "2 · one alternative" }, { k: "STATE", v: "insufficient_data" }] : [
        { k: "BAND", v: `median ± max(3, 3·max(1.4826·MAD, 1)) dB` },
        { k: "SUPPORT", v: `1 cell · ${S0?.cell || "80 m"} · ${BI.length} + 1 passes` },
        { k: "TARGET Δ", v: series.map((s) => `${s.id} ${s.tv - s.med > 0 ? "+" : ""}${(s.tv - s.med).toFixed(1)}`).join(" · ") + " dB" },
        { k: "STATE", v: any ? "observed_departure" : "within_observed_baseline" },
      ],
    };
  }
}
</script>
</body>
</html>
